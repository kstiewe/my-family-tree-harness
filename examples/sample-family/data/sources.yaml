- id: S0016
  type: oral
  title: "Account of Ewa Kowalska about Jakub Kowalski and his third wife"
  quality: oral
  language: pl
  accessed: "2026-01-12"
  informant: "Ewa Kowalska née Nowak (mother of the proband), heard from her mother-in-law — told to the proband 2026-01-12"
  transcription: |
    Uncle Jakub buried two wives and married a third time at fifty-two.
    He used to say that the soil in Wzorki was better than in Zmyślin.
    Aunt Weronika, his third wife, was about ten years older than people thought.

