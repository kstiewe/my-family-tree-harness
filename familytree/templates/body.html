  <div class="seg" id="pages" role="group" aria-label="⟦View⟧"><button type="button" data-page="tree" class="on" aria-pressed="true">⟦Tree⟧</button><button type="button" data-page="map" aria-pressed="false">⟦Map⟧</button></div>
  <span class="muted tree-only" id="stats"></span>
  <div class="seg tree-only" id="views"><button type="button" data-view="full" class="on">⟦Whole tree⟧</button><button type="button" data-view="anc">⟦Ancestors of the proband⟧</button></div>
  <div class="pb tree-only" id="pb" hidden>
    <label for="pb-q">⟦Proband⟧</label>
    <div class="combo">
      <input type="text" id="pb-q" role="combobox" aria-expanded="false" aria-controls="pb-list" aria-autocomplete="list"
             autocomplete="off" spellcheck="false" placeholder="⟦Type a name…⟧">
      <div id="pb-list" role="listbox" aria-label="⟦Persons⟧" hidden></div>
    </div>
    <label class="chk" title="⟦Unticked: also the siblings of the ancestors (with spouses) and the proband's descendants⟧"><input type="checkbox" id="pb-only" checked> ⟦only ancestors⟧</label>
  </div>

<main>
  <div id="chart" tabindex="0" role="region" aria-label="⟦Tree diagram: drag to pan; the mouse wheel or + and − zooms⟧">
    <div id="bands"></div>
    <div id="world"><svg id="lines" aria-hidden="true"></svg></div>
    <div id="labels" aria-hidden="true"></div>
    <div class="ctrl">
      <button type="button" data-z="in" title="⟦Zoom in⟧" aria-label="⟦Zoom in⟧">+</button>
      <button type="button" data-z="out" title="⟦Zoom out⟧" aria-label="⟦Zoom out⟧">−</button>

      <button type="button" data-z="png" title="⟦Save the tree as an image (PNG)⟧" aria-label="⟦Save the tree as an image (PNG)⟧">

      </button>

</main>

<script>
document.documentElement.lang = '__LANG__';
const D = JSON.parse(document.getElementById('tree-data').textContent);
const $ = s => document.querySelector(s);
const chart = $('#chart'), world = $('#world'), lines = $('#lines'), bandsEl = $('#bands'), labelsEl = $('#labels');
const gm = document.getElementById('geomap');          // the family map (templates/map_body.html), the "Map" view
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s).toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
let view = 'full', selected = null, V = null, famById = {}, anim = 0;
const T = { s: 1, x: 0, y: 0 };

const ids = Object.keys(D.persons);
$('#stats').textContent = `⟦${ids.length} persons · ${Object.keys(D.sources).length} sources · as of ${D.generated}⟧`;

// ---- views: the diagram is laid out here, for the proband of the project or one picked in "Ancestors of the proband"

const G = TreeLayout.graph(D), layouts = {};
const PREFS = 'familytree:' + D.title;
const prefs = (() => { try { return JSON.parse(localStorage.getItem(PREFS)) || {}; } catch { return {}; } })();
const savePrefs = () => { try { localStorage.setItem(PREFS, JSON.stringify({ view, proband, onlyAnc })); } catch {} };
let proband = D.persons[prefs.proband] ? prefs.proband : D.proband, onlyAnc = prefs.onlyAnc ?? true;
if (prefs.view === 'anc') view = 'anc';

function currentLayout() {
  const pb = view === 'anc' ? proband : D.proband, mode = view !== 'anc' ? 'all' : onlyAnc ? 'anc' : 'kin', key = `${mode}:${pb}`;
  return layouts[key] ??= TreeLayout.build(D, G, pb, mode);
}

// ---- cards and drawing a view

function cardText(pid) {
  const p = D.persons[pid];
  return [p.card.name + (p.card.maiden ? ' ' + p.card.maiden : ''), ...p.life].join('\n');
}

function cardHTML(pid) {
  const p = D.persons[pid], c = p.card;
  const conf = c.conf === 'probable' ? '<i title="⟦probable⟧">≈</i> ' : c.conf === 'hypothesis' ? '<i title="⟦hypothesis⟧">?</i> ' : '';
  return `<span class="kn">${conf}${esc((V.kek[pid] || []).slice(0, 2).join(', '))}</span><span class="nm">${esc(c.name)}</span>` +
    (c.maiden ? `<span class="md">${esc(c.maiden)}</span>` : '') + p.life.slice(0, 2).map(l => `<span class="lf">${esc(l)}</span>`).join('');
}

function draw() {
  V = currentLayout();
  famById = Object.fromEntries(V.fams.map(f => [f.id, f]));
  $('#pb').hidden = view !== 'anc';
  $('#pb-q').value = proband && D.persons[proband] ? D.persons[proband].name : '';
  $('#pb-only').checked = onlyAnc;
  world.querySelectorAll('.card, .pill').forEach(n => n.remove());
  chart.querySelector('.empty')?.remove();
  lines.innerHTML = bandsEl.innerHTML = labelsEl.innerHTML = '';
  if (!Object.keys(V.nodes).length) {
    chart.insertAdjacentHTML('beforeend', `<p class="empty">${view === 'anc' ? '⟦Pick the proband in the field above (the default one is set in data/project.yaml).⟧' : '⟦No persons in data/persons.yaml.⟧'}</p>`);
    return;
  }
  const [cw, ch] = V.card, path = pts => 'M' + pts.map(p => p.join(' ')).join('L');
  world.style.width = V.w + 'px'; world.style.height = V.h + 'px';
  lines.setAttribute('width', V.w); lines.setAttribute('height', V.h); lines.setAttribute('viewBox', `0 0 ${V.w} ${V.h}`);
  let svg = '';
  for (const f of V.fams) {
    const a = `data-f="${f.id}"`;
    if (f.couple) svg += `<path class="ln" ${a} data-k="c" d="${path(f.couple)}"/>`;
    if (f.drop) svg += `<path class="ln" ${a} d="${path(f.drop)}"/>`;
    if (f.bar) svg += `<path class="ln" ${a} d="${path(f.bar)}"/>`;
    for (const [c, pts] of Object.entries(f.stems)) svg += `<path class="ln" ${a} data-c="${c}" d="${path(pts)}"/>`;
    for (const pts of f.extra) svg += `<path class="ln x" ${a} d="${path(pts)}"/>`;
  }
  lines.innerHTML = svg;
  const frag = document.createDocumentFragment();
  for (const [pid, [x, y]] of Object.entries(V.nodes)) {
    const p = D.persons[pid], b = document.createElement('button');
    b.type = 'button'; b.dataset.pid = pid;
    b.className = `card ${p.sex}${V.kek[pid] ? ' line' : ''}${p.card.conf === 'hypothesis' ? ' hyp' : ''}${pid === V.proband ? ' me' : ''}`;
    Object.assign(b.style, { left: x + 'px', top: y + 'px', width: cw + 'px', height: ch + 'px' });
    b.innerHTML = cardHTML(pid);
    b.title = cardText(pid); b.setAttribute('aria-label', cardText(pid).replace(/\n/g, ', '));
    frag.append(b);
  }
  for (const f of V.fams) if (f.pill) {
    const s = document.createElement('div');
    s.className = 'pill'; s.dataset.f = f.id; s.textContent = f.pill.t;
    Object.assign(s.style, { left: f.pill.x + 'px', top: f.pill.y + 'px' });
    frag.append(s);
  }
  world.append(frag);
  bandsEl.innerHTML = V.lanes.map((l, i) => `<div class="band${i % 2 ? ' alt' : ''}"></div>`).join('');
  labelsEl.innerHTML = V.lanes.map(l => `<div class="lab"><b>${esc(l.title)}</b><span>${esc(l.name)}</span>${l.years ? `<span>${esc(l.years)}</span>` : ''}</div>`).join('');
  home(false);
  if (selected) select(selected, false, chart.classList.contains('focus'));   // Kekule numbers follow the proband
}

// ---- panning and zooming

function apply() {
  if (!V) return;
  world.style.transform = `translate(${T.x}px, ${T.y}px) scale(${T.s})`;
  const bands = bandsEl.children, labs = labelsEl.children;
  V.lanes.forEach((l, i) => {
    const top = T.y + l.y * T.s, h = l.h * T.s;
    bands[i].style.transform = `translateY(${top}px)`;
    bands[i].style.height = h + 'px';
    labs[i].style.transform = `translateY(${top}px)`;
    labs[i].classList.toggle('compact', h < 48);
    labs[i].style.display = h < 20 ? 'none' : '';
  });
}

function animateTo(t) {
  cancelAnimationFrame(anim);
  if (reduceMotion.matches) { Object.assign(T, t); apply(); return; }
  const from = { ...T }, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 280), e = 1 - Math.pow(1 - k, 3);
    for (const key of ['s', 'x', 'y']) T[key] = from[key] + (t[key] - from[key]) * e;
    apply();
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

function zoomAt(f, px, py) {
  const s = clamp(T.s * f, 0.06, 2.5), k = s / T.s;
  T.x = px - (px - T.x) * k; T.y = py - (py - T.y) * k; T.s = s;
  apply();
}

const labelW = () => 0;   // lane labels lie over the cards and take no width

function fitTarget() {
  const r = chart.getBoundingClientRect(), lw = labelW(), pad = 12;
  const s = clamp(Math.min((r.width - lw - pad) / V.w, (r.height - 2 * pad) / V.h), 0.06, 1.1);
  return { s, x: lw + (r.width - lw - pad - V.w * s) / 2, y: (r.height - V.h * s) / 2 };
}
const go = (t, animate) => animate ? animateTo(t) : (Object.assign(T, t), apply());
const fitAll = (animate = true) => go(fitTarget(), animate);

function centerOn(pid, minScale = 0) {
  const n = V && V.nodes[pid];
  if (!n) return false;
  const r = chart.getBoundingClientRect(), lw = labelW(), s = Math.max(T.s, minScale);
  animateTo({ s, x: lw + (r.width - lw) / 2 - (n[0] + V.card[0] / 2) * s, y: r.height / 2 - (n[1] + V.card[1] / 2) * s });
  return true;
}

// Start: the whole tree, unless it would be unreadably small — then a readable scale centred on the proband.
function home(animate = true) {
  let t = fitTarget();
  const n = V.proband && V.nodes[V.proband];
  if (t.s < 0.55 && n) {
    const r = chart.getBoundingClientRect(), lw = labelW(), s = 0.72;
    t = { s, x: lw + (r.width - lw) / 2 - (n[0] + V.card[0] / 2) * s,
          y: V.h * s <= r.height ? (r.height - V.h * s) / 2 : Math.min(12, r.height - 24 - (n[1] + V.card[1]) * s) };
  }
  go(t, animate);
}

chart.addEventListener('wheel', e => {
  e.preventDefault();
  const r = chart.getBoundingClientRect(), dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  cancelAnimationFrame(anim);
  zoomAt(Math.exp(-dy * 0.0016), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

const ptrs = new Map();
let moved = 0, downEl = null, pinch = 0;
chart.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('.ctrl')) return;
  cancelAnimationFrame(anim);
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) { moved = 0; downEl = e.target; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }
  chart.setPointerCapture(e.pointerId);
});
chart.addEventListener('pointermove', e => {
  const prev = ptrs.get(e.pointerId);
  if (!prev) return;
  const cur = [e.clientX, e.clientY];
  ptrs.set(e.pointerId, cur);
  if (ptrs.size === 1) {
    moved += Math.abs(cur[0] - prev[0]) + Math.abs(cur[1] - prev[1]);
    if (moved > 4) { chart.classList.add('panning'); T.x += cur[0] - prev[0]; T.y += cur[1] - prev[1]; apply(); }
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = chart.getBoundingClientRect();
    if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
    pinch = d; moved = 99;
  }
});
const release = e => {
  if (!ptrs.delete(e.pointerId) || ptrs.size) return;
  chart.classList.remove('panning');
  if (moved <= 4 && e.type === 'pointerup') {
    const card = downEl && downEl.closest('.card');
    card ? select(card.dataset.pid, false) : chart.classList.remove('focus');
  }
};
chart.addEventListener('pointerup', release);
chart.addEventListener('pointercancel', release);
world.addEventListener('click', e => {                 // keyboard: Enter/space on a card
  const card = e.target.closest('.card');
  if (card && e.detail === 0) select(card.dataset.pid, false);
});
chart.addEventListener('keydown', e => {
  if (e.target.closest('input')) return;
  const r = chart.getBoundingClientRect(), k = e.key;
  if (k === '+' || k === '=') zoomAt(1.25, r.width / 2, r.height / 2);
  else if (k === '-') zoomAt(0.8, r.width / 2, r.height / 2);
  else if (k === '0') fitAll();
  else if (k.startsWith('Arrow')) { T.x += k === 'ArrowLeft' ? 60 : k === 'ArrowRight' ? -60 : 0; T.y += k === 'ArrowUp' ? 60 : k === 'ArrowDown' ? -60 : 0; apply(); }
  else return;
  e.preventDefault();
});
chart.querySelector('.ctrl').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const r = chart.getBoundingClientRect();
  if (b.dataset.z === 'in') animateTo({ ...zoomed(1.35, r) });
  else if (b.dataset.z === 'out') animateTo({ ...zoomed(1 / 1.35, r) });
  else if (b.dataset.z === 'fit') fitAll();
  else if (b.dataset.z === 'me' && V.proband) select(V.proband, true);
  else if (b.dataset.z === 'png') savePNG(b);
});
function zoomed(f, r) {
  const s = clamp(T.s * f, 0.06, 2.5), k = s / T.s, px = r.width / 2, py = r.height / 2;
  return { s, x: px - (px - T.x) * k, y: py - (py - T.y) * k };
}
new ResizeObserver(() => apply()).observe(chart);

// ---- selection: person card + highlighting their line (ancestors, descendants, spouses)

function lineage(pid) {
  const set = new Set([pid]), P = D.persons;
  const walk = next => { const st = [pid]; while (st.length) { for (const y of next(st.pop())) if (P[y] && !set.has(y)) { set.add(y); st.push(y); } } };
  walk(x => P[x].parents);
  walk(x => P[x].families.flatMap(f => f.children));
  P[pid].families.forEach(f => f.spouse && set.add(f.spouse));
  return set;
}

function mark(pid, lit = true) {
  world.querySelectorAll('.card.sel').forEach(n => n.classList.remove('sel'));
  const card = world.querySelector(`.card[data-pid="${pid}"]`);
  if (!card) { chart.classList.remove('focus'); return null; }
  card.classList.add('sel');
  const set = lineage(pid);
  world.querySelectorAll('.card').forEach(c => c.classList.toggle('on', set.has(c.dataset.pid)));
  const famOn = f => f.parents.some(p => set.has(p)) && f.children.some(c => set.has(c));
  const coupleOn = f => f.parents.length > 1 && f.parents.every(p => set.has(p));
  lines.querySelectorAll('.ln').forEach(l => {
    const f = famById[l.dataset.f];
    l.classList.toggle('on', l.dataset.k === 'c' ? coupleOn(f) : l.dataset.c ? famOn(f) && set.has(l.dataset.c) : famOn(f));
  });
  world.querySelectorAll('.pill').forEach(s => s.classList.toggle('on', coupleOn(famById[s.dataset.f])));
  chart.classList.toggle('focus', lit);
  return card;
}

const plink = pid => pid && D.persons[pid] ? `<span class="link" tabindex="0" role="link" data-go="${pid}">${esc(D.persons[pid].name)}</span>` : '<span class="muted">?</span>';
const srcs = list => (list || []).map(s => {
  const x = D.sources[s] || {};
  const title = esc([x.title, x.repository, x.signature, x.language && '⟦language⟧: ' + x.language].filter(Boolean).join(' · ') || s);
  return x.url ? `<a class="src" href="${esc(x.url)}" target="_blank" rel="noopener" title="${title}">${s}</a>` : `<span class="src" title="${title}">${s}</span>`;
}).join('');
const onActivate = (el, fn) => {
  el.addEventListener('click', fn);
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } });
};

// ---- "At a glance": who the person was, where they lived, whom they lived with … (computed in familytree/summary.py)

const CONF = { probable: '⟦probably⟧', hypothesis: '⟦hypothesis⟧' };
const fnote = (r, refs, link = true) => (r || []).map(n => {         // footnotes; in a <summary> without links
  const sid = refs[n - 1], x = D.sources[sid] || {};
  const title = esc([sid, x.title, x.repository, x.signature].filter(Boolean).join(' · '));
  return x.url && link ? `<a class="fn" href="${esc(x.url)}" target="_blank" rel="noopener" title="${title}">${n}</a>` : `<span class="fn" title="${title}">${n}</span>`;
}).join('');
function gItem(it, refs, long) {
  let t = esc(it.t);
  if (it.pl && gm?.geomap?.hasPlace?.(it.pl)) t = `<span class="link pl" tabindex="0" role="link" data-pl="${it.pl}" title="⟦Show on the map⟧">${t}</span>`;
  else if (it.p && D.persons[it.p]) t = `<span class="link" tabindex="0" role="link" data-go="${it.p}">${t}</span>`;
  const conf = !it.c ? '' : long ? ` <i class="cf">${CONF[it.c]}</i>` : `<i class="cf" title="${CONF[it.c]}">${it.c === 'probable' ? '≈' : '?'}</i>`;
  return `<span class="gi">${t}${it.y ? ` <span class="yr">${esc(it.y)}</span>` : ''}${conf}${fnote(it.r, refs, long)}</span>`;
}
const gShort = (row, refs) => row.items.map(it => it.t === '…' ? '<span class="gi muted">…</span>' : gItem(it, refs)).join(`<span class="sep">${row.sep === '→' ? ' → ' : ' · '}</span>`)
  + row.tail.map(it => `<span class="sep"> · </span>${gItem(it, refs)}`).join('');
function gLine(ln, refs) {
  const items = ln.items.map(it => gItem(it, refs, true)).join(ln.k === 'info' ? '<span class="sep"> · </span>' : ', ');
  const conf = ln.c ? ` <i class="cf">${CONF[ln.c]}</i>` : '';
  const note = ln.n ? ` <span class="nt">${esc(ln.n)}</span>` : '';
  if (ln.k === 'move') return `<li class="g-move"><span class="when"></span><span class="what">${esc(ln.n)}</span></li>`;
  return `<li class="g-${ln.k}"><span class="when">${esc(ln.y || '')}</span><span class="what">${ln.num ? `<b class="num">${ln.num}.</b> ` : ''}` +
    `${ln.k === 'marriage' ? '⚭ ' : ln.k === 'link' ? '↳ ' : ''}${items}${conf}${fnote(ln.r, refs)}${note}</span></li>`;
}
const gSources = s => s.refs.length ? `<details class="g-src"><summary>⟦Sources⟧ (${s.refs.length})</summary><ol>${s.refs.map(sid => {
  const x = D.sources[sid] || {}, t = esc([x.title, x.repository, x.signature].filter(Boolean).join(' · ') || sid);
  return `<li>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${t}</a>` : t} <span class="muted">${sid}</span></li>`;
}).join('')}</ol></details>` : '';
const gQuote = s => s.quote ? `<blockquote class="g-quote"><p>${esc(s.quote.t)}</p><footer>${esc(s.quote.by)}${fnote(s.quote.r, s.refs)}</footer></blockquote>` : '';

// One labelled row per question; the short line is the <summary>, the details open under it.
function glance(p) {
  const s = p.summary;
  if (!s) return '';
  return `<section class="glance" aria-label="⟦At a glance⟧"><h3 class="g-head">⟦At a glance⟧</h3>${s.rows.map(row => `<details class="g-row" data-k="${row.key}">` +
    `<summary><span class="gl">${esc(row.label)}</span><span class="gs">${gShort(row, s.refs)}</span></summary>` +
    `${row.more.length ? `<ol class="g-more">${row.more.map(ln => gLine(ln, s.refs)).join('')}</ol>` : ''}</details>`).join('')}` +
    `${gQuote(s)}${gSources(s)}</section>`;
}

function select(pid, focus = true, lit = true) {
  selected = pid;
  const p = D.persons[pid];
  const conf = { confirmed: '⟦confirmed⟧', probable: '⟦probable⟧', hypothesis: '⟦hypothesis⟧' };
  const kek = V.kek[pid] || [];
  let h = `<h2>${esc(p.name)}</h2><div class="badge">${pid}${kek.length ? ' · ⟦no.⟧ ' + kek.join(', ') : ''}` +
    `${p.confidence ? ' · ' + conf[p.confidence] : ''}${p.religion ? ' · ' + esc(p.religion) : ''}${p.living ? ' · ⟦living person⟧' : ''}</div>`;
  h += glance(p);
  if (!(view === 'anc' && proband === pid)) h += `<button type="button" class="go-anc" data-anc="${pid}">⟦Show the ancestors of this person⟧</button>`;
  if (gm?.geomap?.has(pid)) h += `<button type="button" class="go-anc" data-map="${pid}">⟦Show on the map⟧</button>`;
  if (p.summary) h += `<button type="button" class="go-anc" data-card="${pid}" title="⟦Save this card as an image (PNG)⟧">⟦Save the card (PNG)⟧</button>`;
  if (p.variants) h += `<div class="muted">⟦Variants:⟧ ${esc(p.variants.join(', '))}</div>`;
  if (p.facts.length || p.occupation) {
    h += '<h3>⟦Facts⟧</h3>' + p.facts.map(f => `<p class="fact"><b>${esc(f.label)}</b> ${esc(f.date)}${f.place ? ', ' + esc(f.place) : ''}` +
      `${f.note ? ` <span class="muted">(${esc(f.note)})</span>` : ''}${srcs(f.sources)}</p>`).join('');
    if (p.occupation) h += `<p class="fact"><b>⟦Occupation⟧</b> ${esc(p.occupation.join(', '))}</p>`;
  }
  h += '<h3>⟦Family⟧</h3>';
  h += `<p class="fact"><b>⟦Parents⟧</b> ${p.parents.length ? p.parents.map(plink).join(' ⟦and⟧ ') : '<span class="muted">⟦unknown⟧</span>'}</p>`;
  p.families.forEach(f => {
    h += `<p class="fact"><b>⚭</b> ${plink(f.spouse)}${f.marriage ? ', ' + esc(f.marriage) : ''}${srcs(f.sources)}</p>`;
    if (f.children.length) h += `<p class="fact" style="margin-left:14px">⟦Children:⟧ ${f.children.map(plink).join(', ')}</p>`;
  });
  if (p.notes) h += `<h3>⟦Notes⟧</h3><p class="notes">${esc(p.notes)}</p>`;
  if (p.hints.length) {
    h += '<h3>⟦To research⟧</h3>' + p.hints.map(x => `<div class="hint l${x.level}">${esc(x.text)}<ul>` +
      x.details.map(d => `<li>${esc(d)}</li>`).join('') +
      x.links.map(([label, url]) => `<li><a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a></li>`).join('') + '</ul></div>').join('');
  }
  const det = $('#details');
  det.innerHTML = h; det.scrollTop = 0;
  det.querySelectorAll('[data-go]').forEach(a => onActivate(a, () => select(a.dataset.go)));
  det.querySelectorAll('[data-pl]').forEach(a => onActivate(a, e => { e?.preventDefault?.(); setPage('map'); gm.geomap.showPlace(a.dataset.pl); }));
  det.querySelector('[data-anc]')?.addEventListener('click', () => setProband(pid, 'anc'));
  det.querySelector('[data-map]')?.addEventListener('click', () => { setPage('map'); gm.geomap.showPerson(pid); });
  det.querySelector('[data-card]')?.addEventListener('click', e => saveCard(pid, e.currentTarget));
  document.querySelectorAll('#list div').forEach(d => d.classList.toggle('on', d.dataset.pid === pid));
  if (mark(pid, lit) && focus) centerOn(pid, 0.7);
}

// ---- picking the proband: a text field that filters a list of every person (arrows, Enter, Esc)

const pbQ = $('#pb-q'), pbList = $('#pb-list');
let pbRows = [], pbActive = -1;

function pbOpen(open) {
  pbList.hidden = !open;
  pbQ.setAttribute('aria-expanded', open);
  if (!open) { pbQ.removeAttribute('aria-activedescendant'); pbQ.value = proband && D.persons[proband] ? D.persons[proband].name : ''; }
}

function pbRender(q) {
  const f = fold(q.trim());
  pbRows = ids.filter(id => !f || fold(`${D.persons[id].name} ${(D.persons[id].variants || []).join(' ')} ${id}`).includes(f))
    .sort((a, b) => D.persons[a].name.localeCompare(D.persons[b].name, '__LANG__'));
  pbActive = pbRows.length ? Math.max(0, pbRows.indexOf(proband)) : -1;
  pbList.innerHTML = pbRows.map((id, i) => `<div role="option" id="pbo-${id}" data-pid="${id}" aria-selected="${id === proband}"${i === pbActive ? ' class="act"' : ''}>` +
    `<span>${esc(D.persons[id].name)}${id === D.proband ? ' <i class="muted">⟦(default)⟧</i>' : ''}</span><span class="muted">${esc(D.persons[id].life.join(' '))}</span></div>`).join('')
    || '<p class="muted">⟦No results.⟧</p>';
  pbMove(0);
}

function pbMove(d) {
  if (!pbRows.length) return;
  pbActive = clamp(pbActive + d, 0, pbRows.length - 1);
  pbList.querySelectorAll('[role=option]').forEach((o, i) => o.classList.toggle('act', i === pbActive));
  const o = pbList.children[pbActive];
  pbQ.setAttribute('aria-activedescendant', o.id);
  o.scrollIntoView({ block: 'nearest' });
}

function pbChoose(pid) {
  pbOpen(false);
  if (pid && pid !== proband) setProband(pid);
}

pbQ.addEventListener('focus', () => { pbQ.select(); pbRender(''); pbOpen(true); });

pbQ.addEventListener('blur', () => pbOpen(false));
pbQ.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (pbList.hidden) { pbRender(''); pbOpen(true); } else pbMove(e.key === 'ArrowDown' ? 1 : -1); }
  else if (e.key === 'Enter') { pbChoose(pbRows[pbActive]); pbQ.blur(); }
  else if (e.key === 'Escape') { pbOpen(false); pbQ.blur(); }
  else return;
  e.preventDefault();
});
pbList.addEventListener('pointerdown', e => e.preventDefault());   // keep the focus in the field
pbList.addEventListener('click', e => { const o = e.target.closest('[data-pid]'); if (o) { pbChoose(o.dataset.pid); pbQ.blur(); } });

async function fontsReady() {
  if (!document.fonts) return;
  const css = getComputedStyle(document.documentElement), f = n => css.getPropertyValue('--font-' + n).trim();
  const specs = [`600 20px ${f('display')}`, `600 13px ${f('display')}`, `600 13.5px ${f('body')}`, `11.5px ${f('body')}`,
                 `500 10.5px ${f('mono')}`, `600 10.5px ${f('mono')}`];
  await Promise.race([Promise.all(specs.map(s => document.fonts.load(s).catch(() => null))), new Promise(r => setTimeout(r, 3000))]);
}

function paintView(g, W, H, head) {
  const css = getComputedStyle(document.documentElement), c = n => css.getPropertyValue('--' + n).trim();
  const font = (spec, n) => { g.font = `${spec} ${c('font-' + n)}`; };
  const fit = (text, max) => {                     // the text, shortened with an ellipsis to the width
    if (g.measureText(text).width <= max) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (g.measureText(text.slice(0, m) + '…').width <= max) lo = m; else hi = m - 1; }
    return text.slice(0, lo).trimEnd() + '…';
  };
  const rrect = (x, y, w, h, r) => {
    g.beginPath();
    if (g.roundRect) { g.roundRect(x, y, w, h, r); return; }
    const [a, b, d, e] = Array.isArray(r) ? r : [r, r, r, r];
    g.moveTo(x + a, y); g.arcTo(x + w, y, x + w, y + h, b); g.arcTo(x + w, y + h, x, y + h, d); g.arcTo(x, y + h, x, y, e); g.arcTo(x, y, x + w, y, a); g.closePath();
  };
  const focus = chart.classList.contains('focus'), dim = (el, alpha) => { g.globalAlpha = focus && !el?.classList.contains('on') ? alpha : 1; };
  g.textBaseline = 'middle';
  g.fillStyle = c('bg'); g.fillRect(0, 0, W, H);
  g.fillStyle = c('panel'); g.fillRect(0, 0, W, head);
  g.fillStyle = c('border'); g.fillRect(0, head - 1, W, 1);
  g.fillStyle = c('text'); font('600 20px', 'display'); g.fillText(fit(D.title, W - 48), 24, 24);
  g.fillStyle = c('muted'); font('13px', 'body');
  g.fillText(fit(`${viewCaption()} · ⟦${Object.keys(V.nodes).length} persons · as of ${D.generated}⟧`, W - 48), 24, 46);
  g.translate(0, head);

  V.lanes.forEach((l, i) => {                      // lanes and their labels at the left edge
    g.fillStyle = c(i % 2 ? 'lane-b' : 'lane-a'); g.fillRect(0, l.y, W, l.h);
    g.fillStyle = c('lane-line'); g.fillRect(0, l.y, W, 1);
  });
  const svgLines = [...lines.querySelectorAll('.ln')];
  g.lineJoin = 'round';
  for (const pass of [false, true]) for (const el of svgLines) {      // highlighted lines on top
    const on = focus && el.classList.contains('on');
    if (on !== pass) continue;
    dim(el, 0.18);
    g.strokeStyle = on ? c('hl') : c('line'); g.lineWidth = on ? 2.6 : 1.6;
    g.setLineDash(el.classList.contains('x') ? [5, 4] : []);
    g.stroke(new Path2D(el.getAttribute('d')));
  }
  g.setLineDash([]);
  const [cw, ch] = V.card;
  for (const el of world.querySelectorAll('.card')) {
    const pid = el.dataset.pid, p = D.persons[pid], [x, y] = V.nodes[pid], cl = el.classList;
    const sex = c({ M: 'male', F: 'female' }[p.sex] || 'unk'), tint = c({ M: 'male-bg', F: 'female-bg' }[p.sex] || 'unk-bg');
    dim(el, 0.28);
    const a = g.globalAlpha;
    if (cl.contains('me')) { g.globalAlpha = a * 0.3; g.fillStyle = sex; rrect(x - 4, y - 4, cw + 8, ch + 8, 12); g.fill(); g.globalAlpha = a; }
    g.save();
    g.shadowColor = 'rgba(0,0,0,.08)'; g.shadowBlur = 3; g.shadowOffsetY = 1;
    g.fillStyle = cl.contains('line') ? tint : c('panel'); rrect(x, y, cw, ch, 8); g.fill();
    g.restore();
    g.save(); rrect(x, y, cw, ch, 8); g.clip(); g.fillStyle = sex; g.fillRect(x, y, 5, ch); g.restore();
    const bw = cl.contains('hyp') ? 1.5 : 1;
    g.strokeStyle = cl.contains('line') ? sex : c('border'); g.lineWidth = bw;
    g.setLineDash(cl.contains('hyp') ? [4, 3] : []);
    rrect(x + bw / 2, y + bw / 2, cw - bw, ch - bw, 8 - bw / 2); g.stroke();
    g.setLineDash([]);
    if (cl.contains('sel')) { g.strokeStyle = c('hl'); g.lineWidth = 3; rrect(x - 3.5, y - 3.5, cw + 7, ch + 7, 11); g.stroke(); }
    const rows = [['600 13.5px', 'body', 'text', p.card.name, 17.55, 34]];
    if (p.card.maiden) rows.push(['11.5px', 'body', 'muted', p.card.maiden, 14.95, 0]);
    for (const l of p.life.slice(0, 2)) rows.push(['11.5px', 'body', 'text', l, 15.525, 0]);
    let ty = y + (ch - rows.reduce((s, r) => s + r[4], 0) - (rows.length - 1)) / 2;
    for (const [spec, face, color, text, lh, padR] of rows) {
      font(spec, face); g.fillStyle = c(color);
      g.fillText(fit(text, cw - 24 - padR), x + 14, ty + lh / 2);
      ty += lh + 1;
    }
    const nums = (V.kek[pid] || []).slice(0, 2).join(', '), mark = { probable: '≈', hypothesis: '?' }[p.card.conf] || '';
    g.fillStyle = c('muted'); g.textAlign = 'right';
    font('500 10.5px', 'mono'); g.fillText(nums, x + cw - 8, y + 11.5);
    if (mark) { const w = nums ? g.measureText(nums).width + 4 : 0; font('600 10.5px', 'mono'); g.fillText(mark, x + cw - 8 - w, y + 11.5); }
    g.textAlign = 'left';
  }
  font('500 10.5px', 'mono'); g.textAlign = 'center';
  for (const el of world.querySelectorAll('.pill')) {
    const f = famById[el.dataset.f].pill, w = g.measureText(f.t).width + 14;
    dim(el, 0.28);
    g.fillStyle = c('pill-bg'); g.strokeStyle = c('pill-line'); g.lineWidth = 1;
    rrect(f.x - w / 2, f.y - 9, w, 18, 9); g.fill(); g.stroke();
    g.fillStyle = c('text'); g.fillText(f.t, f.x, f.y + 0.5);
  }
  g.textAlign = 'left'; g.globalAlpha = 1;
  for (const l of V.lanes) {
    font('600 13px', 'display'); const tw = g.measureText(l.title).width;
    font('11.5px', 'body'); const rest = [l.name, l.years].filter(Boolean).map(t => '· ' + t), rw = rest.map(t => g.measureText(t).width);
    const w = 11 + tw + rw.reduce((s, v) => s + 7 + v, 0) + 11, y = l.y + 1;
    g.globalAlpha = 0.88; g.fillStyle = c('panel'); rrect(0, y, w, 24, [0, 0, 8, 0]); g.fill(); g.globalAlpha = 1;
    g.strokeStyle = c('border'); g.lineWidth = 1; rrect(-1, y - 1, w + 0.5, 24.5, [0, 0, 8, 0]); g.stroke();
    g.fillStyle = c('accent'); g.fillRect(0, y, 3, 24);
    g.fillStyle = c('text'); font('600 13px', 'display'); g.fillText(l.title, 11, y + 12.5);
    g.fillStyle = c('muted'); font('11.5px', 'body');
    let x = 11 + tw;
    rest.forEach((t, i) => { x += 7; g.fillText(t, x, y + 12.5); x += rw[i]; });
  }
}

async function renderPNG() {
  const head = 64, W = V.w, H = V.h + head;
  let s = Math.min(3, 30000 / W, 30000 / H, Math.sqrt(80e6 / (W * H)));     // sharp, within the limits of browsers' canvases
  for (let attempt = 0; attempt < 4; attempt++, s *= 0.7) {
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(W * s); canvas.height = Math.round(H * s);
    const g = canvas.getContext('2d');
    if (!g) continue;
    g.scale(s, s);
    paintView(g, W, H, head);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    canvas.width = canvas.height = 0;
    if (blob) return blob;
  }
  throw new Error('canvas');
}

const fileName = text => text.replace(/[\\/:*?"<>|\x00-\x1f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 150) + '.png';

async function saveBlob(blob, name) {
  const dl = await downloads;
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast('⟦Image saved.⟧'); }
    catch (e) { toast(e?.code === 'declined' ? '⟦Saving cancelled.⟧' : '⟦Saving files is not available in this view.⟧'); }
  } else if (window.claude) {
    toast('⟦Saving files is not available in this view.⟧');
  } else {
    const url = URL.createObjectURL(blob), a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast('⟦Image saved.⟧');
  }
}

async function savePNG(btn) {
  if (btn.disabled || !Object.keys(V.nodes).length) return;
  btn.disabled = true;
  toast('⟦Preparing the image…⟧', 0);
  try {
    await fontsReady();
    await new Promise(r => requestAnimationFrame(() => setTimeout(r)));
    await saveBlob(await renderPNG(), fileName(`${D.title} - ${viewCaption()}`));
  } catch {
    toast('⟦The image could not be created — the tree may be too large for this browser.⟧');
  } finally {
    btn.disabled = false;
  }
}

// ---- saving a person's card as an image: the name, "At a glance" with every row open, the quote and the sources

function cardLayout(pid) {
  const p = D.persons[pid], s = p.summary, css = getComputedStyle(document.documentElement);
  const c = n => css.getPropertyValue('--' + n).trim(), face = n => c('font-' + n);
  const F = { title: `600 27px ${face('display')}`, sub: `12px ${face('mono')}`, label: `600 10.5px ${face('body')}`,
    body: `13.5px ${face('body')}`, small: `12.5px ${face('body')}`, mono: `500 11.5px ${face('mono')}`, sup: `600 9px ${face('mono')}`,
    it: `italic 12px ${face('body')}`, quote: `italic 500 16px ${face('display')}`, foot: `11.5px ${face('body')}` };
  const W = 720, pad = 34, labelW = 118, gap = 14, whenW = 78, ops = [], meas = document.createElement('canvas').getContext('2d');
  let y = pad;
  const run = (t, f = 'body', col = 'text', sup = false) => ({ t, f, col, sup });
  const refRuns = r => r?.length ? [run(r.join(','), 'sup', 'accent', true)] : [];
  const itemRuns = (it, f) => [run(it.t, f, it.pl || it.p ? 'accent' : 'text'), ...(it.y ? [run(' ' + it.y, 'mono', 'muted')] : []),
    ...(it.c ? [run(' ' + CONF[it.c], 'it', 'muted')] : []), ...refRuns(it.r)];
  function flow(runs, x0, width, lh) {                     // words wrapped to the width; returns nothing, moves y
    let x = x0;
    for (const r of runs) for (const w of r.sup ? [r.t] : r.t.split(/(\s+)/).filter(Boolean)) {
      meas.font = F[r.f];
      const space = /^\s+$/.test(w), ww = meas.measureText(w).width;
      if (space && x === x0) continue;
      if (!space && x > x0 && x + ww > x0 + width) { y += lh; x = x0; }
      if (!space) ops.push(['t', w, x, y + (r.sup ? -5 : 0), F[r.f], c(r.col)]);
      x += ww;
    }
    y += lh;
  }
  const rule = () => { ops.push(['r', pad, y, W - 2 * pad, 1, c('border')]); };
  ops.push(['r', 0, 0, 6, 0, c({ M: 'male', F: 'female' }[p.sex] || 'unk')]);           // the stripe of the sex, as on the tree cards
  y += 26; ops.push(['t', p.card.name, pad, y, F.title, c('text')]);
  y += 22;
  const nums = (V.kek[pid] || []).length ? ['⟦no.⟧ ' + V.kek[pid].join(', ')] : [];
  flow([run([p.card.maiden, ...p.life, ...nums].filter(Boolean).join('  ·  '), 'sub', 'muted')], pad, W - 2 * pad, 18);
  y += 14; ops.push(['t', '⟦At a glance⟧'.toUpperCase(), pad, y, F.label, c('muted'), '.08em']); y += 10;
  for (const row of s.rows) {
    rule(); y += 21;
    const top = y, cx = pad + labelW + gap, cw = W - pad - cx;
    flow([run(row.label.toUpperCase(), 'label', 'muted')], pad, labelW, 14);
    const after = y; y = top;
    flow(row.items.flatMap((it, i) => [...(i ? [run(row.sep === '→' ? ' → ' : ' · ', 'body', 'muted')] : []), ...itemRuns(it, 'body')])
      .concat(row.tail.flatMap(it => [run(' · ', 'body', 'muted'), ...itemRuns(it, 'body')])), cx, cw, 20);
    if (row.more.length) y += 4;
    for (const ln of row.more) {
      const start = y;
      if (ln.y) ops.push(['t', ln.y, cx, y, F.mono, c('muted')]);
      const runs = [...(ln.num ? [run(ln.num + '. ', 'small', 'text')] : []), ...(ln.k === 'marriage' ? [run('⚭ ', 'small')] : ln.k === 'link' ? [run('↳ ', 'small')] : ln.k === 'move' ? [run('↓ ', 'small', 'muted')] : [])];
      ln.items.forEach((it, i) => runs.push(...(i ? [run(ln.k === 'info' ? ' · ' : ', ', 'small', 'muted')] : []), ...itemRuns(it, ['info', 'end', 'note', 'move', 'divorce'].includes(ln.k) ? 'foot' : 'small')));
      if (ln.c) runs.push(run(' ' + CONF[ln.c], 'it', 'muted'));
      runs.push(...refRuns(ln.r));
      if (ln.n) runs.push(run(' ' + ln.n, 'foot', 'muted'));
      y = start; flow(runs, cx + whenW, cw - whenW, 18);
    }
    y = Math.max(y, after) + 6;
  }
  rule();
  if (s.quote) {
    y += 30; const top = y - 20;
    flow([run('„' + s.quote.t + '”', 'quote', 'text')], pad + 18, W - 2 * pad - 18, 23);
    flow([run(s.quote.by, 'foot', 'muted'), ...refRuns(s.quote.r)], pad + 18, W - 2 * pad - 18, 17);
    ops.push(['r', pad, top, 3, y - top - 8, c('hl')]);
  }
  if (s.refs.length) {
    y += 22; ops.push(['t', '⟦Sources⟧'.toUpperCase(), pad, y, F.label, c('muted'), '.08em']); y += 18;
    s.refs.forEach((sid, i) => {
      const x = D.sources[sid] || {};
      flow([run(`${i + 1}. `, 'foot', 'muted'), run([x.title, x.repository, x.signature].filter(Boolean).join(' · ') || sid, 'foot', 'text'), run(`  ${sid}`, 'sup', 'muted')], pad, W - 2 * pad, 16);
    });
  }
  y += 16; rule(); y += 20;
  ops.push(['t', `${D.title} · ${D.generated}`, pad, y, F.foot, c('muted')]);
  return { W, H: y + pad - 6, ops, bg: c('panel') };
}

async function saveCard(pid, btn) {
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    await fontsReady();
    const { W, H, ops, bg } = cardLayout(pid), s = 2, canvas = document.createElement('canvas');
    canvas.width = W * s; canvas.height = H * s;
    const g = canvas.getContext('2d');
    g.scale(s, s); g.fillStyle = bg; g.fillRect(0, 0, W, H); g.textBaseline = 'alphabetic';
    for (const [kind, ...a] of ops) {
      if (kind === 'r') { g.fillStyle = a[4]; g.fillRect(a[0], a[1], a[2], a[3] || H); continue; }
      const [t, x, y, font, color, spacing] = a;
      g.font = font; g.fillStyle = color;
      if ('letterSpacing' in g) g.letterSpacing = spacing || '0px';
      g.fillText(t, x, y);
    }
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    if (!blob) throw new Error('canvas');
    await saveBlob(blob, fileName(`${D.persons[pid].name} - ${D.title}`));
  } catch {
    toast('⟦The image could not be created.⟧');
  } finally {
    btn.disabled = false;
  }
}

renderList();
setView(view);
if (V.proband) select(V.proband, false, false);
</script>
