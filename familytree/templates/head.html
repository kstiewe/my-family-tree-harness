<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600&display=swap">
<style>
/* Layout: the tree diagram as a canvas on the left, the person card (like a parish-register index card) on the right. */
:root {
  --bg: #f2f4f3; --panel: #ffffff; --text: #1a2220; --muted: #5b6864; --border: #d9e0dd; --chip: #e9eeec;
  --accent: #2f4f8a; --on-accent: #ffffff; --hl: #c98a00; --line: #7c8a86; --crit: #c43d3d; --warn: #c9821f;
  --male: #3d6fb6; --male-bg: #e2ecfa; --female: #b6416f; --female-bg: #fae3ec; --unk: #7d8784; --unk-bg: #eceeed;
  --lane-a: #edf1ef; --lane-b: #f7f9f8; --lane-line: #dbe3e0; --pill-bg: #fff4d6; --pill-line: #d9b75c;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121615; --panel: #1a1f1e; --text: #e4eae8; --muted: #9aa8a3; --border: #2d3533; --chip: #242b29;
    --accent: #9db8f2; --on-accent: #0f1520; --hl: #f0b429; --line: #8d9b97; --crit: #ef6b6b; --warn: #f0a648;
    --male: #82a9ea; --male-bg: #1b2840; --female: #e489ad; --female-bg: #3b2231; --unk: #9aa8a3; --unk-bg: #262c2b;
    --lane-a: #141918; --lane-b: #1a201f; --lane-line: #262e2c; --pill-bg: #3b3218; --pill-line: #8c7431;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121615; --panel: #1a1f1e; --text: #e4eae8; --muted: #9aa8a3; --border: #2d3533; --chip: #242b29;
  --accent: #9db8f2; --on-accent: #0f1520; --hl: #f0b429; --line: #8d9b97; --crit: #ef6b6b; --warn: #f0a648;
  --male: #82a9ea; --male-bg: #1b2840; --female: #e489ad; --female-bg: #3b2231; --unk: #9aa8a3; --unk-bg: #262c2b;
  --lane-a: #141918; --lane-b: #1a201f; --lane-line: #262e2c; --pill-bg: #3b3218; --pill-line: #8c7431;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 14px/1.5 var(--font-body); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
h1 { font: 600 19px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.muted { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--text); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible, a:focus-visible, .link:focus-visible { outline: 2px solid var(--hl); outline-offset: 1px; }
input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); flex: 0 1 260px; min-width: 0; }
/* Proband picker (only in "Ancestors of the proband"): a field that filters a list of persons, and the ancestors-only switch. */
.pb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.pb[hidden] { display: none; }
.pb > label:first-child { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.combo { position: relative; flex: 0 1 280px; min-width: 0; }
.combo::after { content: "▾"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
#pb-q { width: 100%; font: inherit; font-weight: 600; padding: 6px 28px 6px 10px; border: 1px solid var(--accent); border-radius: 6px; background: var(--panel); color: var(--text); text-overflow: ellipsis; }
#pb-q::placeholder { font-weight: 400; color: var(--muted); }
#pb-list { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; width: max(100%, 340px); max-width: calc(100vw - 32px); max-height: min(420px, 60vh);
  overflow: auto; padding: 4px 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.18); }
#pb-list [role=option] { display: flex; justify-content: space-between; gap: 10px; padding: 5px 12px; cursor: pointer; }
#pb-list [role=option] span:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
#pb-list [role=option]:hover, #pb-list .act { background: var(--chip); }
#pb-list [aria-selected=true] { font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
#pb-list i { font-style: normal; }
#pb-list p { margin: 0; padding: 6px 12px; }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.go-anc { display: inline-block; margin-top: 8px; padding: 4px 10px; font: inherit; font-size: 12.5px; color: var(--accent); background: transparent;
  border: 1px solid var(--accent); border-radius: 6px; cursor: pointer; }
.go-anc:hover { background: var(--accent); color: var(--on-accent); }
.go-anc + .go-anc { margin-left: 6px; }
/* The "Map" view: the family map (map.css) takes the place of the diagram; its own title is the page's. */
.on-map main, .on-map .tree-only { display: none !important; }
body:not(.on-map) .geomap { display: none; }
.geomap .gm-title { display: none; }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: minmax(0, 1fr); min-height: 0; }
/* Diagram: generation lanes (background + labels stuck to the left edge), person cards and family lines. */
#chart { position: relative; overflow: hidden; min-height: 0; background: var(--bg); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#chart.panning { cursor: grabbing; }
#chart .empty { position: absolute; margin: 0; padding: 32px 16px; color: var(--muted); max-width: 520px; }
#bands, #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.band { position: absolute; top: 0; left: 0; right: 0; background: var(--lane-a); border-top: 1px solid var(--lane-line); }
.band.alt { background: var(--lane-b); }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#lines { position: absolute; left: 0; top: 0; overflow: visible; }
.ln { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-linejoin: round; }
.ln.x { stroke-dasharray: 5 4; }
.card { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 1px; margin: 0; padding: 6px 10px 6px 14px;
  text-align: left; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  overflow: hidden; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--sex); }
.card.M { --sex: var(--male); --tint: var(--male-bg); }
.card.F { --sex: var(--female); --tint: var(--female-bg); }
.card.U { --sex: var(--unk); --tint: var(--unk-bg); }
.card.line { background: var(--tint); border-color: var(--sex); }
.card.hyp { border-style: dashed; border-width: 1.5px; }
.card.me { box-shadow: 0 0 0 4px color-mix(in srgb, var(--sex) 30%, transparent); }
.card > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .nm { font-weight: 600; font-size: 13.5px; line-height: 1.3; padding-right: 34px; }
.card .md { font-size: 11.5px; line-height: 1.3; color: var(--muted); }
.card .lf { font-size: 11.5px; line-height: 1.35; font-variant-numeric: tabular-nums; }
.card .kn { position: absolute; top: 6px; right: 8px; font: 500 10.5px/1 var(--font-mono); color: var(--muted); }
.card .kn i { font-style: normal; font-weight: 600; }
.card.sel, .card:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
.pill { position: absolute; transform: translate(-50%, -50%); font: 500 10.5px/16px var(--font-mono); padding: 0 6px; border-radius: 9px;
  background: var(--pill-bg); border: 1px solid var(--pill-line); color: var(--text); white-space: nowrap; pointer-events: none; }
#chart.focus .card:not(.on), #chart.focus .pill:not(.on) { opacity: .28; }
#chart.focus .ln:not(.on) { opacity: .18; }
#chart.focus .ln.on { stroke: var(--hl); stroke-width: 2.6; }
.lab { position: absolute; top: 0; left: 0; display: flex; align-items: baseline; gap: 0 7px; padding: 3px 10px 4px 8px; white-space: nowrap;
  border: 1px solid var(--border); border-width: 0 1px 1px 3px; border-left-color: var(--accent); border-radius: 0 0 8px 0;
  background: color-mix(in srgb, var(--panel) 88%, transparent); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.lab b { font: 600 13px/1.3 var(--font-display); }
.lab span { font-size: 11.5px; line-height: 1.3; color: var(--muted); font-variant-numeric: tabular-nums; }
.lab span::before { content: "· "; }
.lab.compact span { display: none; }
.ctrl { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.ctrl button { width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text); font: 600 17px/1 var(--font-body); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.ctrl button:hover { background: var(--chip); }
.ctrl button:disabled { cursor: progress; opacity: .55; }
.toast { position: absolute; left: 12px; bottom: 12px; max-width: min(420px, calc(100% - 72px)); margin: 0; padding: 8px 12px; border-radius: 8px;
  background: var(--text); color: var(--bg); font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.2); pointer-events: none; }
.legend { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
.sw { display: inline-block; width: 24px; height: 13px; margin-right: 6px; vertical-align: -2px; border-radius: 3px;
  border: 1px solid var(--border); border-left: 4px solid var(--male); background: var(--panel); }
.sw.line { background: var(--male-bg); border-color: var(--male); }
.sw.hyp { border-style: dashed; border-left-style: solid; }
aside { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#details { flex: 1 1 60%; overflow: auto; padding: 14px 16px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
#list { flex: 1 1 40%; overflow: auto; padding: 6px 0; }
#list div { padding: 5px 16px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
#list div span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
#list div:hover, #list div.on { background: var(--chip); }
h2 { font: 600 22px/1.2 var(--font-display); margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; }
.fact { margin: 0 0 6px; }
.fact b { font-weight: 600; }
.badge { font: 11.5px/1.4 var(--font-mono); color: var(--muted); }
.src { display: inline-block; font: 11px/1.5 var(--font-mono); background: var(--chip); color: var(--text); border-radius: 4px; padding: 0 5px; margin-left: 4px; text-decoration: none; }
a { color: var(--accent); }
a.src:hover { background: var(--accent); color: var(--on-accent); }
.link { color: var(--accent); cursor: pointer; text-decoration: underline; }
.notes { white-space: pre-wrap; margin: 0; }
.hint { margin: 0 0 10px; padding-left: 10px; border-left: 3px solid var(--border); }
.hint.l1 { border-color: var(--crit); } .hint.l2 { border-color: var(--warn); }
.hint ul { margin: 4px 0 0; padding-left: 18px; }
@media (max-width: 820px) {
  body { display: block; height: auto; }
  main { display: block; }
  #chart { height: 62vh; border-bottom: 1px solid var(--border); }
  .lab span:last-child { display: none; }
  aside { border-left: 0; }
  #details, #list { overflow: visible; }
}
__MAP_CSS__
</style>
