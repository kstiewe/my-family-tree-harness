name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pyyaml
      - name: Tests (on the fictional sample family)
        run: python -m unittest discover -s tests -v
      - name: Privacy guard, generic checks (CI never has private data)
        run: python scripts/guard.py --no-private scan
